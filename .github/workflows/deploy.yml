name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, которых требует публикация на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # puppeteer из devDependencies нужен только стенду — в CI он лишний
      - run: npm ci --omit=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - run: npm install --no-save vite
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
